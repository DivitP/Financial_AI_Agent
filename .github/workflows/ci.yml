name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and legacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install locked development dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Run offline characterization tests
        run: uv run pytest
      - name: Gate offline RAG evaluation thresholds
        run: make rag-eval
      - name: Install locked frontend dependencies
        working-directory: frontend/web
        run: npm ci
      - name: Validate frontend source
        run: make frontend-lint frontend-test frontend-build
      - name: Install browser for accessibility checks
        working-directory: frontend/web
        run: npx playwright install --with-deps chromium
      - name: Gate browser accessibility and responsive checks
        run: make frontend-a11y

  deployment-profiles:
    name: Local and Postgres Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://research:disposable-ci-only@127.0.0.1:5432/research_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups --extra scale
      - run: uv run pytest tests/test_deployment_profiles.py --no-cov

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
